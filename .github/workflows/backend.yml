name: Backend Build and Push (Docker Hub)

on:
  push:
    tags:
      - "v*"
      - "FV*"
      - "backend-*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api]
    timeout-minutes: 30

    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false
          token: ${{ github.token }}

      - name: Prepare Dockerfile and optional pro submodule
        id: dockerfile
        env:
          PRO_TOKEN: ${{ secrets.PRO_TOKEN }}
        run: |
          if [ -n "$PRO_TOKEN" ]; then
            git -c url."https://${PRO_TOKEN}@github.com/".insteadOf=git@github.com: submodule update --init --recursive backend/pro
            echo "FILE=./backend/Dockerfile.${{ matrix.service }}.pro" >> "$GITHUB_OUTPUT"
          else
            echo "FILE=./backend/Dockerfile.${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Get version
        id: get_version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            if [[ $GITHUB_REF == refs/tags/backend-* ]]; then
              VER="${GITHUB_REF#refs/tags/backend-}"
            else
              VER="${GITHUB_REF#refs/tags/}"
            fi
          else
            VER="${GITHUB_SHA::7}"
          fi
          echo "VERSION=${VER}" >> "$GITHUB_OUTPUT"
          REPO="docker.io/${DOCKERHUB_USERNAME:-caodanv}/pandawiki-${{ matrix.service }}"
          {
            echo "TAGS<<EOF"
            echo "${REPO}:${VER}"
            if [[ $GITHUB_REF == refs/tags/FV* ]]; then
              echo "${REPO}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'api' && '.' || './backend' }}
          file: ${{ steps.dockerfile.outputs.FILE }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          platforms: linux/amd64, linux/arm64
          tags: ${{ steps.get_version.outputs.TAGS }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
          cache-to: |
            type=gha,scope=${{ matrix.service }},mode=max
