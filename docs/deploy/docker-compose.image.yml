services:
  panda-wiki-caddy:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-caddy:2.10-alpine
    container_name: panda-wiki-caddy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      CADDY_ADMIN: unix//var/run/caddy/caddy-admin.sock
    volumes:
      - ./data/caddy/caddy_config:/config
      - ./data/caddy/caddy_data:/data
      - ./data/caddy/run:/var/run/caddy
    network_mode: host
    # caddy 的 admin API 在 unix socket 上（CADDY_ADMIN），HTTP 监听端口由 KB 动态下发、
    # 无固定探测端口；admin socket 文件由 caddy run 启动完成时创建，正是 API 下发配置要用的端点
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/caddy/caddy-admin.sock"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  panda-wiki-postgres:
    image: pgvector/pgvector:pg16
    container_name: panda-wiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: panda-wiki
    volumes:
      - pwk_postgres_data:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: 172.19.0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda-wiki"]
      interval: 10s
      timeout: 5s
      retries: 10

  panda-wiki-redis:
    image: redis:7-alpine
    container_name: panda-wiki-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - pwk_redis_data:/data
    networks:
      default:
        ipv4_address: 172.19.0.4
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  panda-wiki-api:
    image: ${PANDAWIKI_IMAGE_REPO}/pandawiki-api:${PANDAWIKI_IMAGE_TAG}
    container_name: panda-wiki-api
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DSN: host=panda-wiki-postgres user=panda-wiki password=${POSTGRES_PASSWORD} dbname=panda-wiki port=5432 sslmode=disable TimeZone=Asia/Shanghai
      REDIS_ADDR: panda-wiki-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-static-file}
      S3_REGION: ${S3_REGION:-oss-cn-hangzhou}
      S3_USE_SSL: ${S3_USE_SSL:-1}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SENTRY_ENABLED: "false"
      CADDY_API: /app/run/caddy-admin.sock
      SUBNET_PREFIX: 172.19.0
      RUN_WORKER: ${RUN_WORKER:-1}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-1}
      ADMIN_PORT: "2443"
      RAG_PROVIDER: ${RAG_PROVIDER:-pg}
      RAG_PG_EMBEDDING_DIM: ${RAG_PG_EMBEDDING_DIM:-1024}
      # 经 caddy 反代部署：X-Real-IP 由 caddy 强制覆盖，限频/限速按真实客户端 IP
      TRUST_PROXY: "true"
    volumes:
      - ./data/caddy/run:/app/run
    # 最终镜像为 alpine:3.21（无 curl，busybox 自带 wget），探测内置 /health 端点
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-redis:
        condition: service_healthy
      panda-wiki-caddy:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "2443:2443"
    networks:
      default:
        ipv4_address: 172.19.0.2

  panda-wiki-app:
    image: ${PANDAWIKI_IMAGE_REPO}/pandawiki-app:${PANDAWIKI_IMAGE_TAG}
    container_name: panda-wiki-app
    restart: unless-stopped
    environment:
      TARGET: http://panda-wiki-api:8000
      STATIC_FILE_TARGET: http://panda-wiki-api:8000
      DEV_KB_ID: ${DEV_KB_ID}
    # 镜像基于 node:22-alpine（无 curl）；用 node fetch 探测 public 静态资源 /favicon.png，
    # 该路径不经过 proxy.ts 中间件、不依赖 API/知识库状态，仅验证 Next 服务本身可用
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3010/favicon.png').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      panda-wiki-api:
        condition: service_healthy
    expose:
      - "3010"
    networks:
      default:
        ipv4_address: 172.19.0.112

volumes:
  pwk_postgres_data:
  pwk_redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
