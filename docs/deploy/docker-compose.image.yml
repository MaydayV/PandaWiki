services:
  panda-wiki-caddy:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-caddy:2.10-alpine
    container_name: panda-wiki-caddy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      CADDY_ADMIN: unix//var/run/caddy/caddy-admin.sock
    volumes:
      - ./data/caddy/caddy_config:/config
      - ./data/caddy/caddy_data:/data
      - ./data/caddy/run:/var/run/caddy
    network_mode: host

  panda-wiki-postgres:
    image: pgvector/pgvector:pg16
    container_name: panda-wiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: panda-wiki
    volumes:
      - pwk_postgres_data:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: 172.19.0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda-wiki"]
      interval: 10s
      timeout: 5s
      retries: 10

  panda-wiki-redis:
    image: redis:7-alpine
    container_name: panda-wiki-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - pwk_redis_data:/data
    networks:
      default:
        ipv4_address: 172.19.0.4
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  panda-wiki-nats:
    image: nats:2.10-alpine
    container_name: panda-wiki-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222", "--user", "panda-wiki", "--pass", "${NATS_PASSWORD}"]
    volumes:
      - pwk_nats_data:/data
    networks:
      default:
        ipv4_address: 172.19.0.13
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  panda-wiki-api:
    image: ${PANDAWIKI_IMAGE_REPO}/pandawiki-api:${PANDAWIKI_IMAGE_TAG}
    container_name: panda-wiki-api
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DSN: host=panda-wiki-postgres user=panda-wiki password=${POSTGRES_PASSWORD} dbname=panda-wiki port=5432 sslmode=disable TimeZone=Asia/Shanghai
      MQ_NATS_SERVER: nats://panda-wiki-nats:4222
      NATS_PASSWORD: ${NATS_PASSWORD}
      REDIS_ADDR: panda-wiki-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-static-file}
      S3_REGION: ${S3_REGION:-oss-cn-hangzhou}
      S3_USE_SSL: ${S3_USE_SSL:-1}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SENTRY_ENABLED: "false"
      CADDY_API: /app/run/caddy-admin.sock
      SUBNET_PREFIX: 172.19.0
      RUN_WORKER: ${RUN_WORKER:-1}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-1}
      ADMIN_PORT: "2443"
      RAG_PROVIDER: ${RAG_PROVIDER:-pg}
      RAG_PG_EMBEDDING_DIM: ${RAG_PG_EMBEDDING_DIM:-1024}
    volumes:
      - ./data/caddy/run:/app/run
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-redis:
        condition: service_healthy
      panda-wiki-nats:
        condition: service_healthy
      panda-wiki-caddy:
        condition: service_started
    ports:
      - "8000:8000"
      - "2443:2443"
    networks:
      default:
        ipv4_address: 172.19.0.2

  panda-wiki-app:
    image: ${PANDAWIKI_IMAGE_REPO}/pandawiki-app:${PANDAWIKI_IMAGE_TAG}
    container_name: panda-wiki-app
    restart: unless-stopped
    environment:
      TARGET: http://panda-wiki-api:8000
      STATIC_FILE_TARGET: http://panda-wiki-api:8000
      DEV_KB_ID: ${DEV_KB_ID}
    depends_on:
      panda-wiki-api:
        condition: service_started
    expose:
      - "3010"
    networks:
      default:
        ipv4_address: 172.19.0.112

volumes:
  pwk_postgres_data:
  pwk_redis_data:
  pwk_nats_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
